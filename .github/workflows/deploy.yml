name: Test and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: blastex-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      - name: Install Python dependencies
        run: pip install -r requirements-api.txt pytest

      - name: Run Python tests
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/blastex_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/blastex_deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy to production VPS
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          DEPLOY_ATTEMPTS: "3"
          DEPLOY_RETRY_DELAY_SECONDS: "60"
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          # Сервер обновляет код `git fetch`-ем. GitHub временами ограничивает
          # неаутентифицированные скачивания, и тогда обновление падает с кодом
          # 128 ещё до сборки образов. Ограничение временное, поэтому повторяем;
          # постоянное решение — аутентифицировать remote на сервере (см. README).
          status=0
          for attempt in $(seq 1 "$DEPLOY_ATTEMPTS"); do
            status=0
            # Сборка образов на сервере идёт минутами и молчит, пока pip качает
            # колёса. Без keepalive соединение рвётся на этом молчании, и деплой
            # падает с `client_loop: send disconnect: Broken pipe` (код 255).
            ssh \
              -i "$HOME/.ssh/blastex_deploy" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              -o TCPKeepAlive=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            echo "::warning::Попытка $attempt не удалась (код $status)"
            if [ "$attempt" -lt "$DEPLOY_ATTEMPTS" ]; then
              sleep "$DEPLOY_RETRY_DELAY_SECONDS"
            fi
          done
          echo "::error::Развёртывание не удалось после $DEPLOY_ATTEMPTS попыток (код $status)"
          exit "$status"
